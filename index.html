pan{min-width:140px}.sheet-grid{display:grid;grid-template-columns:1.08fr 1fr;gap:20px}.section-label{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:14px;font-weight:bold;color:var(--green)}.section-label i{font-style:normal;background:#e9f0e4;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:11px}.habits-table,.prizes-table{border-collapse:collapse;width:100%;font-size:11px;table-layout:fixed}.habits-table th,.prizes-table th{text-align:left;font-size:10px;background:#f0f3ec;color:#617260;font-weight:normal;padding:8px}.habits-table td,.prizes-table td{border-bottom:1px solid var(--line);padding:9px 7px;line-height:1.5;overflow-wrap:anywhere}.habits-table td:first-child{color:#9ca797;font-size:10px;width:23px}.habits-table th:last-child,.habits-table td:last-child{text-align:center;width:40px;color:var(--green);font-weight:bold}.prizes-table th:first-child{width:40px}.prizes-table th:nth-child(2){width:39px}.prizes-table td:first-child{color:var(--green);font-weight:bold}.prizes-table td:nth-child(2){color:#8a9387;font-size:10px}.prizes-table td{padding:7px 6px}.rules-block{margin-top:20px}.rule-card{border:1px solid #e5e8dc;background:#fafaf4;padding:10px 12px;border-radius:9px;margin-bottom:8px;display:flex;align-items:flex-start;gap:10px;font-size:11px;line-height:1.5;overflow-wrap:anywhere}.rule-number{color:var(--accent);font-size:13px;font-weight:bold}.rule-card b{color:var(--green)}.sheet-note{font-size:9px;line-height:1.6;color:#828c7e;margin:12px 0 0;white-space:pre-line;overflow-wrap:anywhere}.board-section{margin-top:20px;padding:14px 16px;background:#f6f7f0;border:1px solid #e6eadf;border-radius:12px}.board-heading{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--green);margin-bottom:10px;font-weight:bold}.board-heading span{font-size:9px;font-weight:normal;color:#889280}.sticker-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}.sticker-cell{height:31px;border:1px dashed #bfcbb5;border-radius:50%;background:white;display:flex;justify-content:center;align-items:center;color:#b5bdae;font-size:9px}.sticker-cell.milestone{border-style:solid;background:#ebf0df;color:#6b8057}.signatures{display:flex;justify-content:space-between;font-size:10px;color:#62715e;margin-top:18px;gap:15px}.sheet-footer{font-size:8px;color:#9aa18f;text-align:center;margin-top:14px;letter-spacing:1px}.compact .sheet-heading h2{font-size:25px}.compact .habits-table td{padding:6px}.compact .prizes-table td{padding:5px}.compact .rule-card{padding:7px}.compact .rules-block{margin-top:12px}.compact .board-section{margin-top:12px}.compact .sticker-cell{height:27px}.compact .signatures{margin-top:12px}@media(max-width:1150px){.workspace{grid-template-columns:340px minmax(0,1fr)}.editor{padding:24px}.preview-area{padding:25px 20px}.paper{margin:0}}@media(max-width:800px){.topbar{padding:14px 18px;align-items:flex-start;flex-direction:column}.actions{flex-wrap:wrap;width:100%}.actions button{font-size:12px;flex:1}.workspace{display:block}.editor{min-height:0;padding:24px}.intro h1{font-size:25px}.preview-area{padding:24px 12px}.paper-wrap{overflow:visible}.paper{margin:auto}.preview-caption{font-size:11px}.privacy{padding:0 8px}}@page{size:A4 portrait;margin:0}@media print{html,body{width:210mm;background:white;margin:0}body{-webkit-print-color-adjust:exact;print-color-adjust:exact}.topbar,.editor,.preview-caption,.privacy,#overflow{display:none!important}.workspace{display:block;margin:0;max-width:none}.preview-area{padding:0;overflow:visible}.paper-wrap{padding:0;overflow:visible;height:297mm!important}.paper{padding:13mm 14mm;box-shadow:none;margin:0;width:210mm;height:297mm;transform:none!important}#paperContent{transform-origin:top left}.paper{break-inside:avoid;break-after:avoid}}

<main class="workspace">
 <aside class="editor">
  <div class="intro"><span class="eyebrow">작은 약속, 차곡차곡</span><h1>함께 정하고,<br>함께 지켜요.</h1><p>항목과 원칙을 자유롭게 바꾸고, A4 한 장으로 출력하세요.</p></div>
  <div id="status" role="status" aria-live="polite">이 브라우저에 자동 저장됩니다.</div>
  <nav class="tabs" aria-label="편집 영역"><button class="active" data-tab="habits" aria-selected="true">스티커 받기</button><button data-tab="rules" aria-selected="false">모으는 원칙</button><button data-tab="prizes" aria-selected="false">뽑기 선물</button></nav>
  <section class="basics"><label>약속표 제목<input id="title" maxlength="50"></label><div class="field-pair"><label>아이 이름<input id="child" maxlength="30" placeholder="이름을 적어주세요"></label><label>시작 날짜<input id="date" type="date"></label></div><div class="field-pair board-settings"><label>스티커판 칸 수<input id="total" type="number" min="1" max="100"></label><label class="toggle"><input id="showBoard" type="checkbox"> 스티커판 표시</label></div></section>
  <section id="rows" aria-label="항목 편집"></section><button id="add" class="add-button">+ 항목 추가</button>
  <section class="notes"><label>작은 안내 문구<textarea id="note" rows="2" maxlength="400"></textarea></label><p>뽑기의 ‘장수’는 해당 등수의 뽑기표 개수예요.</p><p>인쇄 창에서 A4 · 세로 · 배율 100% · 머리글/바닥글 해제 · 배경 그래픽 켜기를 선택하세요.</p></section>
  <button id="reset" class="reset">처음 내용으로 되돌리기</button>
 </aside>
 <section class="preview-area" aria-label="약속표 미리보기"><div class="preview-caption"><span>인쇄 미리보기 · A4 한 장</span><span id="ticketTotal"></span></div><div id="overflow" role="alert" hidden></div><div class="paper-wrap"><article id="paper" class="paper"><div id="paperContent"></div></article></div><p class="privacy">이름과 수정 내용은 현재 브라우저에만 저장돼요. 다른 기기로 옮길 때는 백업 파일을 사용하세요.</p></section>
</main><input id="file" type="file" accept=".json,application/json" hidden><script id="initialData">window.PROMISES_INITIAL=null;</script><script>'use strict';
const KEY='family-promises-editor-v2';
const DEFAULTS={title:'우리 가족 스티커 약속',child:'',date:'',total:50,showBoard:false,note:'취침 스티커는 9시 또는 10시 중 한 가지만 받아요.\n약속을 바꿀 때는 아이와 부모님이 함께 정해요.',habits:[{text:'밥 다 먹기',count:1},{text:'우유 한 잔 마시기 (200mL)',count:1},{text:'비타민 챙겨 먹기',count:1},{text:'오후 9시까지 잠들기',count:2},{text:'오후 10시까지 잠들기',count:1},{text:'하루에 책 5권 읽기',count:1},{text:'치즈 한 장 먹기',count:1}],rules:[{text:'스티커 10개를 채우면',reward:'뽑기 한 번'},{text:'30개까지 뽑기 안 하고 모으면',reward:'닌텐도 30분'},{text:'50개를 전부 채우면',reward:'5,000원'}],prizes:[{rank:'1등',count:1,text:'게임 1시간'},{rank:'2등',count:4,text:'TV 1시간 (닌텐도 제외)'},{rank:'3등',count:6,text:'게임 30분'},{rank:'4등',count:8,text:'TV 30분 (닌텐도 제외)'},{rank:'5등',count:10,text:'토요일 수영장 가기'},{rank:'6등',count:12,text:'보드게임 1시간'},{rank:'7등',count:14,text:'줄넘기 1,000개 하기'},{rank:'8등',count:16,text:'엄마 / 아빠 족욕 5분 해드리기'},{rank:'9등',count:18,text:'산책 30분 (킥보드 제외)'},{rank:'10등',count:20,text:'책 1권 읽기'}]};
const clone=x=>JSON.parse(JSON.stringify(x));
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function validate(d){
 if(!d||typeof d!=='object')throw Error('올바른 백업 파일이 아니에요.');
 const str=(v,max=400)=>{if(typeof v!=='string'||v.length>max)throw Error('내용이나 길이를 확인해주세요.');return v;};
 const num=(v,max=999)=>{if(!Number.isInteger(v)||v<1||v>max)throw Error('장수는 1 이상의 정수로 입력해주세요.');return v;};
 const rows=(v,fn)=>{if(!Array.isArray(v)||v.length>40)throw Error('항목은 영역별로 40개까지 가능해요.');return v.map(fn);};
 const date=str(d.date,10);if(date&&!/^\d{4}-\d{2}-\d{2}$/.test(date))throw Error('날짜 형식을 확인해주세요.');
 return {title:str(d.title,50),child:str(d.child,30),date,total:num(d.total,100),showBoard:!!d.showBoard,note:str(d.note),habits:rows(d.habits,r=>({text:str(r.text),count:num(r.count)})),rules:rows(d.rules,r=>({text:str(r.text),reward:str(r.reward)})),prizes:rows(d.prizes,r=>({rank:str(r.rank,30),count:num(r.count),text:str(r.text)}))};
}
let data=clone(window.PROMISES_INITIAL||DEFAULTS),tab='habits',storageOK=true;
try{const saved=localStorage.getItem(KEY);if(saved&&!window.PROMISES_INITIAL)data=validate(JSON.parse(saved));}catch(e){storageOK=false;}
function status(s){$('#status').textContent=s;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));storageOK=true;status('저장했어요 · 이 브라우저에 자동 저장됩니다.');}catch(e){storageOK=false;status('자동 저장이 어려워요. 백업 파일로 저장해주세요.');}}
function basics(){for(const id of ['title','child','date','total','note'])$('#'+id).value=data[id];$('#showBoard').checked=data.showBoard;}
function editor(){
 $('#rows').innerHTML=data[tab].map((r,i)=>`<div class="edit-row"><div class="row-head"><span>${tab==='habits'?'스티커 항목':tab==='rules'?'원칙':'뽑기'} ${i+1}</span><button data-remove="${i}" aria-label="${i+1}번째 항목 삭제">삭제</button></div>${tab==='rules'?`<label>조건<textarea data-index="${i}" data-key="text" maxlength="400">${esc(r.text)}</textarea></label><label>받는 보상<textarea data-index="${i}" data-key="reward" maxlength="400">${esc(r.reward)}</textarea></label>`:tab==='prizes'?`<div class="field-pair"><label>등수<input data-index="${i}" data-key="rank" maxlength="30" value="${esc(r.rank)}"></label><label>뽑기표 장수<input type="number" min="1" max="999" data-index="${i}" data-key="count" value="${r.count}"></label></div><label>내용<textarea data-index="${i}" data-key="text" maxlength="400">${esc(r.text)}</textarea></label>`:`<div class="field-pair"><label>스티커 받는 경우<textarea data-index="${i}" data-key="text" maxlength="400">${esc(r.text)}</textarea></label><label>스티커 수<input type="number" min="1" max="999" data-index="${i}" data-key="count" value="${r.count}"></label></div>`}</div>`).join('');
}
function preview(){
 $('#ticketTotal').textContent=`뽑기표 총 ${data.prizes.reduce((s,r)=>s+r.count,0)}장`;
 $('#paperContent').innerHTML=`<header class="sheet-heading"><div class="sheet-kicker">OUR FAMILY PROMISE</div><div class="sheet-star" aria-hidden="true">✦</div><h2>${esc(data.title||'우리 가족 스티커 약속')}</h2><p>하루하루 작은 약속을 지키며, 즐겁게 모아봐요.</p></header><div class="identity"><span>이름　${esc(data.child||'________________')}</span><span>시작 날짜　${esc(data.date?data.date.replaceAll('-',' . '):'______ . ____ . ____')}</span></div><div class="sheet-grid"><div><h3 class="section-label"><i>01</i> 이렇게 스티커를 받아요</h3><table class="habits-table"><colgroup><col style="width:23px"><col><col style="width:40px"></colgroup><thead><tr><th>No.</th><th>약속</th><th>장수</th></tr></thead><tbody>${data.habits.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.text)}</td><td>${r.count}장</td></tr>`).join('')}</tbody></table><div class="rules-block"><h3 class="section-label"><i>02</i> 모으면 이런 보상이 있어요</h3>${data.rules.map((r,i)=>`<div class="rule-card"><span class="rule-number">${String(i+1).padStart(2,'0')}</span><div>${esc(r.text)}<br><b>${esc(r.reward)}</b></div></div>`).join('')}</div><p class="sheet-note">${esc(data.note)}</p></div><div><h3 class="section-label"><i>03</i> 두근두근, 뽑기 선물</h3><table class="prizes-table"><thead><tr><th>등수</th><th>장수</th><th>내용</th></tr></thead><tbody>${data.prizes.map(r=>`<tr><td>${esc(r.rank)}</td><td>${r.count}장</td><td>${esc(r.text)}</td></tr>`).join('')}</tbody></table><p class="sheet-note">장수 = 해당 등수의 뽑기표 개수</p></div></div>${false?`<section class="board-section"><div class="board-heading">나의 스티커판<span>${data.total}칸을 차곡차곡 채워요</span></div><div class="sticker-grid">${Array.from({length:data.total},(_,i)=>`<div class="sticker-cell ${(i+1)%10===0?'milestone':''}">${i+1}</div>`).join('')}</div></section>`:''}<div class="signatures"><span>아이 서명　________________</span><span>부모님 서명　________________</span></div><div class="sheet-footer">함께 정한 약속 · 함께 쌓는 즐거움</div>`;
 requestAnimationFrame(fit);
}
let printScale=1;
function fit(){
 const p=$('#paper'),c=$('#paperContent');c.style.transform='';c.style.width='';p.classList.remove('compact');
 const max=p.clientHeight-parseFloat(getComputedStyle(p).paddingTop)-parseFloat(getComputedStyle(p).paddingBottom);
 if(c.scrollHeight>max)p.classList.add('compact');
 printScale=Math.min(1,max/c.scrollHeight);
 c.style.transform=`scale(${printScale})`;c.style.transformOrigin='top left';
 const warning=$('#overflow');warning.hidden=printScale>=0.85;warning.textContent='내용이 많아 한 장에 맞추면 글씨가 작아져요. 항목을 줄이거나 스티커판을 숨겨주세요.';
 responsive();
}
function responsive(){const paper=$('#paper'),wrap=$('.paper-wrap');if(innerWidth<=800){const scale=Math.min(1,wrap.clientWidth/paper.offsetWidth);paper.style.transform=`scale(${scale})`;paper.style.transformOrigin='top left';wrap.style.height=`${paper.offsetHeight*scale+12}px`;}else{paper.style.transform='';wrap.style.height='';}}
for(const id of ['title','child','date','total','note','showBoard'])$('#'+id).addEventListener('input',e=>{if(id==='total'){if(!e.target.validity.valid||!Number.isInteger(Number(e.target.value)))return;data.total=Number(e.target.value);}else data[id]=id==='showBoard'?e.target.checked:e.target.value;save();preview();});
$('.tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(!b)return;tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(t=>{t.classList.toggle('active',t===b);t.setAttribute('aria-selected',t===b?'true':'false');});editor();});
$('#rows').addEventListener('input',e=>{const t=e.target;if(!t.dataset.key)return;const k=t.dataset.key;if(k==='count'&&(!t.validity.valid||!Number.isInteger(Number(t.value))))return;data[tab][Number(t.dataset.index)][k]=k==='count'?Number(t.value):t.value;save();preview();});
$('#rows').addEventListener('click',e=>{const b=e.target.closest('[data-remove]');if(!b)return;data[tab].splice(Number(b.dataset.remove),1);save();editor();preview();});
$('#add').addEventListener('click',()=>{if(data[tab].length>=40){status('항목은 영역별로 40개까지 추가할 수 있어요.');return;}data[tab].push(tab==='rules'?{text:'새로운 조건',reward:'새로운 보상'}:tab==='prizes'?{rank:`${data.prizes.length+1}등`,count:1,text:'새로운 선물'}:{text:'새로운 약속',count:1});save();editor();preview();});
$('#print').addEventListener('click',()=>{const invalid=document.querySelector('input:invalid');if(invalid){invalid.reportValidity();return;}fit();window.print();});
$('#backup').addEventListener('click',()=>{const a=document.createElement('a');const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.href=url;a.download='family-promises-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);status('백업 파일을 저장했어요.');});
$('#import').addEventListener('click',()=>$('#file').click());
$('#file').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>150000)throw Error('백업 파일이 너무 커요.');const incoming=validate(JSON.parse(await f.text()));if(!confirm('현재 약속표를 백업 파일의 내용으로 바꿀까요?'))return;data=incoming;save();basics();editor();preview();}catch(err){status('불러오지 못했어요. '+(err instanceof SyntaxError?'JSON 백업 파일인지 확인해주세요.':err.message));}finally{e.target.value='';}});
$('#reset').addEventListener('click',()=>{if(!confirm('수정한 내용을 지우고 처음 약속표로 되돌릴까요? 백업 파일을 먼저 저장할 수 있어요.'))return;data=clone(DEFAULTS);save();basics();editor();preview();});
window.addEventListener('resize',responsive);window.addEventListener('beforeprint',fit);
basics();editor();preview();if(!storageOK)status('저장 내용을 읽지 못했어요. 백업 파일로 저장해주세요.');


$('#saveHtml').addEventListener('click',()=>{
 const copy=document.documentElement.cloneNode(true);
 copy.querySelector('#initialData').textContent='window.PROMISES_INITIAL='+JSON.stringify(data).replace(/</g,'\\u003c')+';';
 const url=URL.createObjectURL(new Blob(['<!doctype html>\n'+copy.outerHTML],{type:'text/html;charset=utf-8'}));
 const a=document.createElement('a');a.href=url;a.download='family-promises-edited.html';a.click();
 setTimeout(()=>URL.revokeObjectURL(url),1000);status('수정한 내용이 담긴 HTML 파일을 저장했어요.');
});
</script>
</body></html>
